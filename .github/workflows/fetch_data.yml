name: Fetch and analyse data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          DHIS2_URL:  ${{ secrets.DHIS2_URL }}
          DHIS2_USER: ${{ secrets.DHIS2_USER }}
          DHIS2_PASS: ${{ secrets.DHIS2_PASS }}
        run: python fetch_data.py

      - name: Run analysis
        run: python analyse.py

      - name: Commit results
        run: |
          git config user.name "diagnet-bot"
          git config user.email "bot@diagnet.ai"
          git add data/ results.json
          git diff --cached --quiet || git commit -m "Auto update $(date +%F)"
          git push
